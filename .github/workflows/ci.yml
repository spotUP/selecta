name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3
      # dui-build-deps configures with SELECTA_UI_DESKTOP=ON, which needs SDL3 (find_package CONFIG, 3.2 or newer).
      # Ubuntu LTS runners have no libsdl3-dev package, so build the release tag once and point CMake at it.
      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch release-3.4.8 https://github.com/libsdl-org/SDL "$RUNNER_TEMP/sdl-src"
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl3"
          cmake --build "$RUNNER_TEMP/sdl-build"
          cmake --install "$RUNNER_TEMP/sdl-build"
          echo "CMAKE_PREFIX_PATH=$HOME/sdl3" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build/host -G Ninja
      - name: Build
        run: cmake --build build/host
      - name: Lint
        run: cmake --build build/host --target lint
      # dui-red: deliberate red rows of the unfinished desktop UI (dui-ratchet still counts them, it only lists with
      # `ctest -L dui -N`). m68k-gcc: rows that need the Amiga cross compiler, which host runners do not have.
      - name: Test
        run: ctest --test-dir build/host -LE 'dui-red|m68k-gcc' --output-on-failure

  # Amiga 68020 cross build plus the vamos ctest rows. Image liv2/amiga-gcc
  # (bebbo m68k-amigaos-gcc 6.5.0b, amitools vamos, Ubuntu 24.04), pinned by
  # digest. vamos runs Kickstart-free, so no ROM is needed.
  # The host side builds only selecta-cli (the vamos rows compare against it).
  # Excluded rows: amiga-machine expects vamos's 8384512 byte FAST_RAM (the
  # image's vamos reports 4123444), render-golden-amiga* need the host test
  # song, and the two desktop-console frame rows need host targets not built here.
  amiga-68020:
    runs-on: ubuntu-latest
    container:
      image: liv2/amiga-gcc:main@sha256:570461426e8eabdde4f7507da62ed985a9c07147ecb12d0754d85678255eb34d
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cmake and ninja
        run: apt-get update && apt-get install -y cmake ninja-build
      # The desktop UI plugin (SEL_DESKTOP_AGA defaults ON) needs the host-built bake tools, the RULES.md "Build (Amiga
      # 68020) with the desktop UI" sequence: host gui_iconbake and gui_fontbake first, then the -D paths (I987).
      - name: Configure (host bake tools)
        run: cmake -S . -B build/host -G Ninja
      - name: Build (host bake tools)
        run: cmake --build build/host --target gui_iconbake gui_fontbake
      - name: Configure (68020)
        run: cmake -S . -B build/amiga -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/amiga-68020.cmake -DCMAKE_BUILD_TYPE=Debug -DAMIGA_GCC_ROOT=/opt/amiga -DSELECTA_ICONBAKE_EXE=$PWD/build/host/plugins/ui/desktop/gui_iconbake -DSELECTA_FONTBAKE_EXE=$PWD/build/host/plugins/ui/desktop/gui_fontbake
      - name: Build (68020)
        run: cmake --build build/amiga -j2
      - name: Build (host selecta-cli)
        run: cmake --build build/host --target selecta-cli
      - name: Test (vamos)
        run: ctest --test-dir build/host -R amiga -E 'render-golden|amiga-machine$|amiga-text-ui-vamos|amiga-console-first-frame-vamos' --output-on-failure
