name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3
      # dui-build-deps configures with SELECTA_UI_DESKTOP=ON, which needs SDL3 (find_package CONFIG, 3.2 or newer).
      # Ubuntu LTS runners have no libsdl3-dev package, so build the release tag once and point CMake at it.
      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          # Build dependencies from SDL's README-linux (Ubuntu list): X11 and Wayland backends, audio, input.
          sudo apt-get install -y build-essential pkg-config gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev libdecor-0-dev liburing-dev
          git clone --depth 1 --branch release-3.4.8 https://github.com/libsdl-org/SDL "$RUNNER_TEMP/sdl-src"
          cmake -S "$RUNNER_TEMP/sdl-src" -B "$RUNNER_TEMP/sdl-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl3"
          cmake --build "$RUNNER_TEMP/sdl-build"
          cmake --install "$RUNNER_TEMP/sdl-build"
          echo "CMAKE_PREFIX_PATH=$HOME/sdl3" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build/host -G Ninja
      - name: Build
        run: cmake --build build/host
      - name: Lint
        run: cmake --build build/host --target lint
      # dui-red: deliberate red rows of the unfinished desktop UI (dui-ratchet still counts them, it only lists with
      # `ctest -L dui -N`). m68k-gcc: rows that need the Amiga cross compiler, which host runners do not have.
      - name: Test
        run: ctest --test-dir build/host -LE 'dui-red|m68k-gcc|golden' --output-on-failure

  # Amiga 68020 cross build plus the vamos ctest rows. Image liv2/amiga-gcc
  # (bebbo m68k-amigaos-gcc 6.5.0b, amitools vamos, Ubuntu 24.04), pinned by
  # digest. vamos runs Kickstart-free, so no ROM is needed.
  # The host side builds only selecta-cli (the vamos rows compare against it).
  # Excluded rows: amiga-machine expects vamos's 8384512 byte FAST_RAM (the
  # image's vamos reports 4123444), render-golden-amiga* need the host test
  # song, and the two desktop-console frame rows need host targets not built here.
  amiga-68020:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: liv2/amiga-gcc:main@sha256:570461426e8eabdde4f7507da62ed985a9c07147ecb12d0754d85678255eb34d
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cmake and ninja
        run: apt-get update && apt-get install -y cmake ninja-build zlib1g-dev
      # The desktop UI plugin (SEL_DESKTOP_AGA defaults ON) needs the host-built bake tools, the RULES.md "Build (Amiga
      # 68020) with the desktop UI" sequence: host gui_iconbake and gui_fontbake first, then the -D paths (I987).
      - name: Configure (host bake tools)
        run: cmake -S . -B build/host -G Ninja
      - name: Build (host bake tools)
        run: cmake --build build/host --target gui_iconbake gui_fontbake library_template_bake
      - name: Configure (68020)
        run: cmake -S . -B build/amiga -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/amiga-68020.cmake -DCMAKE_BUILD_TYPE=Debug -DAMIGA_GCC_ROOT=/opt/amiga -DSELECTA_ICONBAKE_EXE=$PWD/build/host/plugins/ui/desktop/gui_iconbake -DSELECTA_FONTBAKE_EXE=$PWD/build/host/plugins/ui/desktop/gui_fontbake -DSELECTA_TEMPLATEBAKE_EXE=$PWD/build/host/src/library/library_template_bake
      - name: Build (68020)
        run: cmake --build build/amiga -j2
      # I1137: the Selecta archive tree (program, library-template.db beside it, Install-Selecta, rexx), packed with lha when found, else zipped.
      - name: Build Selecta package
        run: |
          (apt-get install -y lha || apt-get install -y jlha-utils) >/dev/null 2>&1 || true
          cmake --build build/amiga --target selecta_dist
          cd build/amiga/dist
          if command -v lha >/dev/null 2>&1; then lha ao5 Selecta.lha Selecta; else cmake -E tar cf Selecta.zip --format=zip Selecta; fi
          ls -l
      - name: Upload Selecta package
        uses: actions/upload-artifact@v4
        with:
          name: Selecta-amiga
          path: |
            build/amiga/dist/Selecta.lha
            build/amiga/dist/Selecta.zip
          if-no-files-found: error
      - name: Attach Selecta package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/amiga/dist
          gh release upload "${GITHUB_REF_NAME}" $(ls Selecta.lha Selecta.zip 2>/dev/null) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (host selecta-cli)
        run: cmake --build build/host --target selecta-cli
      - name: Test (vamos)
        run: ctest --test-dir build/host -R amiga -E 'render-golden|amiga-machine$|amiga-text-ui-vamos|amiga-console-first-frame-vamos' --output-on-failure
      # I685l: the UP-MCC package (design 2026-11-06-mui-mcc-package.md section 9). lha is not known to be in the image: try to install
      # one (a failure is not fatal); without lha the staged drawer is zipped instead. No Aminet upload (row I685m).
      - name: Build UP-MCC package
        run: |
          (apt-get install -y lha || apt-get install -y jlha-utils) >/dev/null 2>&1 || true
          cmake -S . -B build/amiga >/dev/null
          cmake --build build/amiga --target up_mcc_dist
          cd build/amiga/plugins/shared/mcc/dist
          if [ ! -f UP-MCC.lha ]; then cmake -E tar cf UP-MCC.zip --format=zip UP-MCC; fi
          ls -l
      - name: Upload UP-MCC package
        uses: actions/upload-artifact@v4
        with:
          name: UP-MCC
          path: |
            build/amiga/plugins/shared/mcc/dist/UP-MCC.lha
            build/amiga/plugins/shared/mcc/dist/UP-MCC.zip
            build/amiga/plugins/shared/mcc/dist/UP-MCC.readme
          if-no-files-found: error
      - name: Attach UP-MCC to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/amiga/plugins/shared/mcc/dist
          gh release upload "${GITHUB_REF_NAME}" UP-MCC.readme $(ls UP-MCC.lha UP-MCC.zip 2>/dev/null) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
