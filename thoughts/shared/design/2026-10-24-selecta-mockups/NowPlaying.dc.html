<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selecta Now Playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#09090B}
a{color:#F2F2F5;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
.icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;background:none;border:0;color:#C8C8D0;cursor:pointer}
.icon:hover{color:#FFFFFF}
.tab{height:36px;padding:0 16px;border-radius:6px;border:0;font-size:14px;font-weight:600;cursor:pointer;background:none;color:#C8C8D0}
.tab:hover{color:#FFFFFF}
.row{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 52px;align-items:center;gap:12px;padding:6px 10px;border-radius:6px}
.row:hover{background:#FFFFFF12}
</style>
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#F2F2F5;background:#09090B">
<div style="position:absolute;inset:0;background:radial-gradient(900px 600px at 25% 30%,{{tint}} 0%,#09090B 70%)"></div>

<div style="position:relative;height:100%;display:grid;grid-template-rows:64px minmax(0,1fr) 96px">
<header style="display:flex;align-items:center;justify-content:space-between;padding:0 24px">
<button class="icon" aria-label="Collapse now playing"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display:flex;gap:4px;background:#00000040;border-radius:8px;padding:4px">
<button class="tab" style="background:#FFFFFF1F;color:#FFFFFF">Now playing</button>
<button class="tab">Visualizer</button>
<button class="tab">Pattern</button>
<button class="tab">Song info</button>
</div>
<button class="icon" aria-label="Full screen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
</header>

<div style="display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;padding:16px 48px 0">
<section style="display:flex;flex-direction:column;justify-content:center;gap:28px">
<div style="display:flex;align-items:flex-end;gap:32px">
<div style="width:340px;height:340px;flex:none;border-radius:10px;background:linear-gradient(135deg,#8B7BF0 0%,#4C3FA0 45%,#120E2E 100%);box-shadow:0 24px 64px #000000B3;position:relative;overflow:hidden">
<svg viewBox="0 0 340 340" width="340" height="340" aria-hidden="true" style="position:absolute;inset:0;opacity:.35"><circle cx="250" cy="90" r="120" fill="none" stroke="#FFFFFF" stroke-width="1"></circle><circle cx="250" cy="90" r="80" fill="none" stroke="#FFFFFF" stroke-width="1"></circle><circle cx="250" cy="90" r="40" fill="none" stroke="#FFFFFF" stroke-width="1"></circle></svg>
</div>
<div style="display:flex;flex-direction:column;gap:10px;min-width:0;padding-bottom:8px">
<span style="font-size:13px;font-weight:600;color:#C8C8D0">Playing from Demoscene classics</span>
<h1 style="margin:0;font-size:56px;line-height:1.02;font-weight:700;letter-spacing:-0.03em">Space Debris</h1>
<div style="display:flex;align-items:center;gap:8px;font-size:15px;color:#C8C8D0">
<a href="#" style="font-weight:600">Captain</a><span aria-hidden="true">·</span><span>1991</span><span aria-hidden="true">·</span><span>6:12</span>
</div>
<div style="display:flex;gap:8px;margin-top:6px">
<span style="height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;background:#FFFFFF1A;font-size:12px;font-weight:600">ProTracker MOD</span>
<span style="height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;background:#FFFFFF1A;font-size:12px;font-weight:600">4 channels</span>
<span style="height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:4px;background:#FFFFFF1A;font-size:12px;font-weight:600">Native 68k player</span>
</div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:13px;font-weight:600;color:#C8C8D0">Channels</span>
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<sc-for list="{{channels}}" as="ch" hint-placeholder-count="4">
<div style="background:#00000059;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;font-size:12px;color:#C8C8D0"><span>{{ch.label}}</span><span>{{ch.sample}}</span></div>
<div style="display:flex;align-items:flex-end;gap:3px;height:56px">
<sc-for list="{{ch.bars}}" as="b" hint-placeholder-count="16">
<span style="flex:1;border-radius:2px;background:{{accent}};height:{{b.h}}"></span>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<aside aria-label="Up next" style="background:#00000059;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;align-self:center;max-height:560px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px">
<span style="font-size:17px;font-weight:700">Up next</span>
<a href="#" style="font-size:13px;font-weight:600;color:#C8C8D0">Open queue</a>
</div>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="8">
<div class="row">
<span style="font-size:13px;color:#A0A0AC;text-align:right">{{q.n}}</span>
<span style="width:44px;height:44px;border-radius:4px;background:{{q.art}}"></span>
<span style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{q.name}}</span>
<span style="font-size:12px;color:#A0A0AC">{{q.meta}}</span>
</span>
<span style="font-size:13px;color:#A0A0AC;text-align:right">{{q.len}}</span>
</div>
</sc-for>
</aside>
</div>

<footer aria-label="Player" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 48px">
<div style="display:flex;align-items:center;gap:12px;width:100%;max-width:880px;font-size:12px;color:#C8C8D0">
<span>2:14</span>
<div style="flex:1;height:4px;border-radius:2px;background:#FFFFFF33;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:36%;border-radius:2px;background:#FFFFFF"></div><div style="position:absolute;left:36%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#FFFFFF"></div></div>
<span>6:12</span>
</div>
<div style="display:flex;align-items:center;gap:20px">
<button class="icon" aria-label="Shuffle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"></path><path d="m18 2 4 4-4 4"></path><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"></path><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"></path><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"></path></svg></button>
<button class="icon" aria-label="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" x2="5" y1="19" y2="5"></line></svg></button>
<button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width:56px;height:56px;border-radius:50%;border:0;background:#FFFFFF;color:#09090B;display:flex;align-items:center;justify-content:center;cursor:pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></sc-if>
</button>
<button class="icon" aria-label="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg></button>
<button class="icon" aria-label="Repeat" style="color:{{accent}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></button>
</div>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B82F6","options":["#3B82F6","#2DD4BF","#F59E0B","#E0457B"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const g = (a, b) => 'linear-gradient(135deg,' + a + ' 0%,' + b + ' 100%)';
    const playing = this.state && this.state.playing === false ? false : true;
    const shapes = [
      [30,55,80,62,44,70,92,66,40,28,50,74,60,38,22,46],
      [64,40,22,36,58,82,70,48,30,52,76,90,58,34,20,42],
      [18,26,44,68,86,72,50,32,46,64,80,56,36,24,30,52],
      [50,72,60,38,24,40,66,88,74,52,34,28,46,70,62,44]
    ];
    const samples = ['bass', 'lead', 'snare', 'pad'];
    return {
      accent: this.props.accent ?? '#3B82F6',
      tint: '#3A2E7A',
      playing: playing,
      paused: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !playing }),
      channels: shapes.map((s, i) => ({ label: 'Channel ' + (i + 1), sample: samples[i], bars: s.map(h => ({ h: h + '%' })) })),
      queue: [
        { n: '1', name: 'Elysium', meta: 'Jester', len: '5:48', art: g('#164E63', '#22D3EE') },
        { n: '2', name: 'Klisje paa klisje', meta: 'Walkman', len: '3:56', art: g('#713F12', '#FDE047') },
        { n: '3', name: 'Unreal II', meta: 'Purple Motion', len: '7:21', art: g('#3B0764', '#A855F7') },
        { n: '4', name: 'Stardust Memories', meta: 'Jester', len: '4:40', art: g('#9D174D', '#F9A8D4') },
        { n: '5', name: 'Enigma', meta: 'Tip and Firefox', len: '5:02', art: g('#1E3A8A', '#60A5FA') },
        { n: '6', name: 'Turrican 2 title', meta: 'Chris Huelsbeck', len: '4:17', art: g('#991B1B', '#FCA5A5') },
        { n: '7', name: 'Guitar Slinger', meta: 'Jogeir Liljedahl', len: '3:33', art: g('#78350F', '#F59E0B') },
        { n: '8', name: 'Hymn to Aurora', meta: 'Horace Wimp', len: '6:05', art: g('#064E3B', '#34D399') }
      ]
    };
  }
}
</script>
</body>
</html>
